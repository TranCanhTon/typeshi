<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Dead Keys</title>
    <style>
      html, body { margin: 0; height: 100%; overflow: hidden; background: #000; }
      #app canvas { display: block; }
      #dk-copy {
        position: fixed; left: 16px; bottom: 16px; z-index: 10; width: min(520px, calc(100vw - 32px));
        background: #1a120c; border: 1px solid #6a4a2a; color: #f0c070; font: 12px/1.4 monospace; padding: 8px;
      }
      #dk-copy .dk-copy-head { display: flex; justify-content: space-between; gap: 8px; margin-bottom: 6px; }
      #dk-copy button { background: #3a2616; color: #f0c070; border: 1px solid #6a4a2a; cursor: pointer; }
      #dk-copy textarea {
        width: 100%; height: 260px; box-sizing: border-box; background: #0c0805; color: #f4d8a8;
        border: 1px solid #3a2616; font: 11px/1.35 monospace;
      }
    </style>
  </head>
  <body>
    <div id="app"></div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
